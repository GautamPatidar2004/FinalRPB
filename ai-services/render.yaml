services:
  - type: web
    name: railway-planning-ai
    env: python
    region: oregon
    plan: free
    rootDir: ai-services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PYTHONIOENCODING
        value: utf-8
